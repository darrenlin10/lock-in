name: CI
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test

  browser:
    # End-to-end smoke test and emulated iPhone Safari compatibility test.
    # Pinned OS: Playwright only supports specific Ubuntu releases.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Playwright (test-only, not an app dependency)
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:compat
      - name: Live API check without a key (free; skips if unreachable)
        run: npm run test:live
